name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_reports
          POSTGRES_PASSWORD: lab_reports
          POSTGRES_DB: lab_reports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_reports"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://lab_reports:lab_reports@localhost:5432/lab_reports
      # Compile SQL checks from the committed .sqlx/ data; tests still run
      # against the real Postgres service.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo nextest run --all-features --locked --profile ci
      - name: The API's TypeScript types are committed (written by the tests)
        run: test -z "$(git status --porcelain web/src/api/generated)"
      # Fails the build when a finished milestone's criterion has no passing
      # test (docs/architecture.md). Runs after failed tests too, to show
      # them, but not when the tests never ran.
      - name: Evidence pack
        if: ${{ !cancelled() && hashFiles('target/nextest/ci/junit.xml') != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          signed=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}" --jq .commit.verification.verified || echo unknown)
          cargo run --locked --quiet -- evidence --commit "${{ github.sha }}" --signed "$signed"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('target/evidence/index.html') != '' }}
        with:
          name: evidence-pack
          path: target/evidence/index.html

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint and format
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build

  e2e:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_reports
          POSTGRES_PASSWORD: lab_reports
          POSTGRES_DB: lab_reports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_reports"
          --health-interval 2s
          --health-retries 30
      mailpit:
        image: axllent/mailpit:v1.27.11
        ports:
          - 8025:8025
    env:
      DATABASE_URL: postgres://lab_reports:lab_reports@localhost:5432/lab_reports
      SQLX_OFFLINE: "true"
      BIND_ADDR: 127.0.0.1:3000
      WEB_DIR: web/dist
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the server
        run: cargo build --locked
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build the app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm exec playwright install --with-deps chromium
      - name: Start with one clinic, its administrator and a physician
        run: |
          ./target/debug/lab-report-assistant migrate
          clinic=$(./target/debug/lab-report-assistant clinic add --name "Example Women's Health" --email admin@example.test)
          ./target/debug/lab-report-assistant clinic add-physician --clinic "$clinic" --email dr.example@example.test --name "Dr. Example"
          nohup ./target/debug/lab-report-assistant serve > server.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:3000/health && break; sleep 1; done
      - name: Browser tests
        working-directory: web
        run: pnpm e2e
      - name: Server log
        if: failure()
        run: cat server.log

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
