name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lab_reports
          POSTGRES_PASSWORD: lab_reports
          POSTGRES_DB: lab_reports
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_reports"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://lab_reports:lab_reports@localhost:5432/lab_reports
      # Compile SQL checks from the committed .sqlx/ data; tests still run
      # against the real Postgres service.
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo nextest run --all-features --locked --profile ci

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
